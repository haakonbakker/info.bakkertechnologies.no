en:
  label: "Contact"
  title: "Let’s talk."
  lead: "Tell me what you’re building, where it’s stuck, or what you’d like to see shipped. Email is the simplest way to start."
  copy: "Copy address"
  copied: "Copied"
  include_title: "Helpful to include"
  include:
    - k: "What you’re working on"
      v: "a product idea, an existing app, or a team challenge."
    - k: "Where things stand"
      v: "a sketch, a brief, a codebase, a deadline."
    - k: "What kind of help"
      v: "building it, or advising the people who are."
  next_title: "What happens next"
  next:
    - k: "I read your message myself"
      v: "Every enquiry is read and answered personally."
    - k: "A short conversation"
      v: "If it looks like a fit, we set up a call to understand the details."
    - k: "A concrete proposal"
      v: "Scope, approach, timeline and cost, written down so it’s easy to decide."
  apps_note: "Need help with Fast Reminders, Templator or The One Thing? See <a class=\"link\" href=\"/support/\">Support</a>, or use the same address."
"no":
  label: "Kontakt"
  title: "La oss snakke."
  lead: "Fortell meg hva du bygger, hvor det står fast, eller hva du ønsker å få lansert. E-post er den enkleste måten å starte på."
  copy: "Kopier adresse"
  copied: "Kopiert"
  include_title: "Nyttig å ta med"
  include:
    - k: "Hva du jobber med"
      v: "en produktidé, en eksisterende app eller en utfordring i teamet."
    - k: "Hvor dere står"
      v: "en skisse, et oppdrag, en kodebase, en frist."
    - k: "Hva slags hjelp"
      v: "å bygge det, eller å gi råd til de som gjør det."
  next_title: "Hva skjer videre"
  next:
    - k: "Jeg leser meldingen selv"
      v: "Alle henvendelser leses og besvares personlig."
    - k: "En kort samtale"
      v: "Hvis det ser ut som en match, avtaler vi en samtale for å forstå detaljene."
    - k: "Et konkret forslag"
      v: "Omfang, tilnærming, tidslinje og pris, skrevet ned så det er enkelt å bestemme seg."
  apps_note: "Trenger du hjelp med Fast Reminders, Templator eller The One Thing? Se <a class=\"link\" href=\"/no/hjelp/\">Hjelp</a>, eller bruk samme adresse."
