en:
  label: "About"
  title: "Built by one person, on purpose."
  lead: "Bakker Technologies is the independent studio of Haakon Bakker, a software engineer from the Oslo area with fifteen years of building software."
  photo_alt: "Haakon Bakker, smiling, in front of a warm orange background"
  story_label: "Background"
  story:
    - "I’ve been building software for fifteen years, in finance, sports and the arts, as part of product teams and on my own."
    - "Bakker Technologies is where I do independent work: native iOS products of my own, like Templator and The One Thing, and selected consultancy for teams that need senior iOS or architecture help."
    - "The studio is deliberately small. There are no account managers, no subcontractors and no hand-offs. The person you talk to is the person who designs, writes and ships the work."
    - "Alongside the studio I work full-time as an engineer at Vipps MobilePay. Bakker Technologies is independent, and is not affiliated with or endorsed by my employer."
  values_label: "Principles"
  values:
    - title: "Craft"
      text: "Code is a material. It deserves care, from the architecture down to the last animation curve."
    - title: "Clarity"
      text: "Good software is simple to use and simple to maintain. Both take more work than complexity does."
    - title: "Respect"
      text: "Apps should respect the people using them: collect as little as possible, and say plainly what is collected."
  facts_label: "In brief"
  facts:
    - k: "Based"
      v: "Oslo area, Norway"
    - k: "Experience"
      v: "15 years building software"
    - k: "Focus"
      v: "iOS and iPadOS, product engineering, architecture"
    - k: "Shipped"
      v: "Templator and The One Thing, plus Cryptolandia (now retired)"
    - k: "Languages"
      v: "Norwegian, English"
  closing_title: "Let’s work together."
  closing_text: "I’d like to hear about what you’re building."
"no":
  label: "Om"
  title: "Bygget av én person, med vilje."
  lead: "Bakker Technologies er det uavhengige studioet til Haakon Bakker, en programvareutvikler fra Oslo-området med femten års erfaring."
  photo_alt: "Haakon Bakker, smilende, foran en varm oransje bakgrunn"
  story_label: "Bakgrunn"
  story:
    - "Jeg har bygget programvare i femten år, innen finans, sport og kunst, både i produktteam og på egen hånd."
    - "Bakker Technologies er der jeg gjør selvstendig arbeid: egne native iOS-produkter, som Templator og The One Thing, og utvalgte rådgivningsoppdrag for team som trenger senior iOS- eller arkitekturkompetanse."
    - "Studioet er bevisst lite. Ingen kundeansvarlige, ingen underleverandører og ingen overleveringer. Den du snakker med er den som designer, skriver og leverer arbeidet."
    - "Ved siden av studioet jobber jeg fulltid som utvikler i Vipps MobilePay. Bakker Technologies er uavhengig, og er verken tilknyttet eller anbefalt av arbeidsgiveren min."
  values_label: "Prinsipper"
  values:
    - title: "Håndverk"
      text: "Kode er et materiale. Det fortjener omtanke, fra arkitekturen til den siste animasjonskurven."
    - title: "Klarhet"
      text: "God programvare er enkel å bruke og enkel å vedlikeholde. Begge deler krever mer arbeid enn kompleksitet."
    - title: "Respekt"
      text: "Apper skal respektere menneskene som bruker dem: samle inn så lite som mulig, og si tydelig hva som samles inn."
  facts_label: "Kort fortalt"
  facts:
    - k: "Base"
      v: "Oslo-området"
    - k: "Erfaring"
      v: "15 år med programvareutvikling"
    - k: "Fokus"
      v: "iOS og iPadOS, produktutvikling, arkitektur"
    - k: "Lansert"
      v: "Templator og The One Thing, samt Cryptolandia (nå avviklet)"
    - k: "Språk"
      v: "Norsk, engelsk"
  closing_title: "La oss jobbe sammen."
  closing_text: "Jeg hører gjerne om hva du bygger."
