en:
  label: "Services"
  title: "Senior engineering, without the agency around it."
  lead: "Two distinct offerings with one thing in common: you work directly with an engineer who has designed and shipped apps on the App Store, and who stays accountable for the result."
  offers:
    - id: product
      label: "01 — Product development"
      title: "iOS product development"
      text: "You have an idea, a brief, or an existing app that needs rebuilding. The studio takes it from where it is to a native product in the App Store — and keeps improving it after launch."
      for_title: "Who it’s for"
      for: "Founders launching a first app, companies adding iPhone and iPad to an existing product, and teams without in-house iOS expertise."
      outcomes_title: "What you get"
      outcomes:
        - "A clear scope: what to build first, and what to leave out"
        - "Interface design that feels native to iOS"
        - "A Swift and SwiftUI codebase built to be maintained"
        - "App Store submission, launch and post-launch iteration"
      how_title: "How it works"
      how: "Usually a defined first release, followed by ongoing product work if it makes sense. You see working builds early and often."
    - id: consultancy
      label: "02 — Consultancy"
      title: "Technical consultancy"
      text: "Your team is already building. What it needs is senior judgement — someone who can weigh the trade-offs, make the call, and then help get it done."
      for_title: "Who it’s for"
      for: "Engineering teams and leaders who need depth on a specific problem, a second opinion on direction, or extra senior capacity for a period."
      outcomes_title: "What you get"
      outcomes:
        - "Architecture and technical strategy, written down"
        - "Code and design reviews that raise the bar"
        - "Performance and quality audits with concrete next steps"
        - "Hands-on delivery alongside your engineers"
      how_title: "How it works"
      how: "Embedded in your team and tools for an agreed period, or scoped around a single question. Engagement terms are agreed individually."
  approach_label: "Approach"
  approach_title: "How a project moves."
  steps:
    - title: "Understand"
      text: "The problem, the people using it, and the constraints that matter."
    - title: "Shape"
      text: "Structure, flows and interface decided before the code is written."
    - title: "Build"
      text: "Clean, tested code, delivered in working increments."
    - title: "Ship"
      text: "App Store release, launch support and continued iteration."
  industries_label: "Experience"
  industries_title: "Finance, sports and the arts."
  industries_text: "Fifteen years of shipping software across very different domains. Different problems sharpen the same skills — and the tools are chosen for the problem, not the other way around."
  closing_title: "Have a project in mind?"
  closing_text: "Tell me about it, and I’ll tell you honestly whether I can help."
"no":
  label: "Tjenester"
  title: "Senior utvikling, uten byrået rundt."
  lead: "To ulike tjenester med én ting felles: du jobber direkte med en utvikler som har lansert egne produkter, og som står ansvarlig for resultatet."
  offers:
    - id: product
      label: "01 — Produktutvikling"
      title: "iOS-produktutvikling"
      text: "Du har en idé, et oppdrag eller en eksisterende app som må bygges på nytt. Studioet tar den fra der den er til et native produkt i App Store — og fortsetter å forbedre den etter lansering."
      for_title: "Hvem det passer for"
      for: "Gründere som lanserer sin første app, selskaper som utvider produktet sitt til iPhone og iPad, og team uten egen iOS-kompetanse."
      outcomes_title: "Hva du får"
      outcomes:
        - "Et tydelig omfang: hva som bygges først, og hva som utelates"
        - "Grensesnittdesign som føles naturlig på iOS"
        - "En kodebase i Swift og SwiftUI, bygget for å vedlikeholdes"
        - "Innsending til App Store, lansering og videreutvikling"
      how_title: "Slik foregår det"
      how: "Som regel en avgrenset første versjon, fulgt av løpende produktarbeid hvis det gir mening. Du ser fungerende versjoner tidlig og ofte."
    - id: consultancy
      label: "02 — Rådgivning"
      title: "Teknisk rådgivning"
      text: "Teamet ditt bygger allerede. Det som trengs er senior dømmekraft — noen som kan veie avveiningene, ta beslutningen, og så hjelpe til med å få det gjort."
      for_title: "Hvem det passer for"
      for: "Utviklingsteam og ledere som trenger dybde på et konkret problem, en ekstra vurdering av retningen, eller mer senior kapasitet i en periode."
      outcomes_title: "Hva du får"
      outcomes:
        - "Arkitektur og teknisk strategi, skrevet ned"
        - "Kode- og designgjennomganger som hever nivået"
        - "Ytelses- og kvalitetsrevisjoner med konkrete neste steg"
        - "Praktisk utvikling sammen med utviklerne dine"
      how_title: "Slik foregår det"
      how: "Integrert i teamet og verktøyene dine i en avtalt periode, eller avgrenset rundt ett spørsmål. Vilkår avtales individuelt."
  approach_label: "Tilnærming"
  approach_title: "Slik beveger et prosjekt seg."
  steps:
    - title: "Forstå"
      text: "Problemet, menneskene som bruker løsningen, og rammene som betyr noe."
    - title: "Forme"
      text: "Struktur, flyt og grensesnitt bestemmes før koden skrives."
    - title: "Bygge"
      text: "Ren, testet kode, levert i fungerende steg."
    - title: "Lansere"
      text: "Lansering i App Store, oppfølging og videre utvikling."
  industries_label: "Erfaring"
  industries_title: "Finans, sport og kunst."
  industries_text: "Femten år med programvare på tvers av svært ulike domener. Ulike problemer skjerper de samme ferdighetene — og verktøyene velges etter problemet, ikke omvendt."
  closing_title: "Har du et prosjekt i tankene?"
  closing_text: "Fortell meg om det, så får du et ærlig svar på om jeg kan hjelpe."
