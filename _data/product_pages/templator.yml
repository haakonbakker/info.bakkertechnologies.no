en:
  chapters:
    - label: "Templates"
      title: "Write the checklist once."
      text: "Weekly reviews, sprint kickoffs, travel packing, client onboarding. Build each as a template with sections, tasks, notes and due-date offsets, or start from 49 ready-made templates across eight categories."
      screen: editor
    - label: "Variables"
      title: "Fill in only what changes."
      text: "Put placeholders like {{client}} or {{deadline}} in task titles and notes. When you dispatch, Templator asks for them with a date picker, number pad or menu, and remembers defaults and recent answers."
      ticks:
        - "Text, date, number and choice variables"
        - "Due dates that follow a date variable"
        - "Inline autocomplete for variables"
      diagram: variables
    - label: "Review"
      title: "Check it, then send it."
      text: "Every dispatch opens a review sheet. Switch off the tasks this run doesn’t need (or a whole section at once) and send only what matters."
      screen: dispatch
    - label: "Destinations"
      title: "Lands where you already work."
      text: "Apple Reminders works out of the box. With Pro, Templator also sends to Things 3 as projects with headings, to Todoist projects, and to OmniFocus with due dates intact."
      diagram: destinations
  diagram:
    template_label: "Template"
    result_label: "Dispatched"
    rows:
      - before: "Kickoff call with {{client}}"
        after: "Kickoff call with Fjord & Co."
      - before: "Send recap by {{deadline}}"
        after: "Send recap by Friday"
    destinations:
      - name: "Reminders"
        note: "Free · built in"
      - name: "Things 3"
        note: "Pro · projects with headings"
      - name: "Todoist"
        note: "Pro · existing or new projects"
      - name: "OmniFocus"
        note: "Pro · TaskPaper with due dates"
  details_label: "The details"
  details_title: "Small things, done properly."
  details:
    - k: "Home Screen widgets"
      v: "Dispatch a favourite template without opening the app."
    - k: "Siri and Shortcuts"
      v: "Run templates from Spotlight, Shortcuts or the Action Button."
    - k: "Share templates"
      v: "Export .templator files and send them by AirDrop, Messages or email."
    - k: "iCloud sync"
      v: "Templates stay in step across your iPhone and iPad."
    - k: "Swipe to dispatch"
      v: "Send a simple template straight from the list."
    - k: "Pins and colours"
      v: "Keep frequent templates on top, in one of ten gradient colours."
  plans_label: "Pricing"
  plans_title: "Free to start. Pro when it earns its place."
  plans:
    - name: "Free"
      text: "Enough to make it part of your week. No account required."
      items:
        - "3 templates"
        - "2 variables per template"
        - "Apple Reminders"
        - "iCloud sync and the starter gallery"
    - name: "Pro"
      text: "For the workflows you run every week. Available as an in-app purchase."
      items:
        - "Unlimited templates and variables"
        - "Things 3, Todoist and OmniFocus"
        - "Dynamic due-date offsets"
        - "Pinned templates and a new list per dispatch"
  privacy_label: "Privacy"
  privacy_title: "Your templates stay yours."
  privacy_text: "Templates are stored on your device and in your private iCloud container. There’s no account to create, and the studio can’t see your templates. Anonymous usage analytics help improve the app. They are never linked to you or sold."
  privacy_link: "Privacy policy"
  terms_link: "Terms of service"
  closing_title: "Templator for iPhone and iPad."
  closing_text: "Free to download, with an optional Pro upgrade."

"no":
  chapters:
    - label: "Maler"
      title: "Skriv sjekklisten én gang."
      text: "Ukentlige gjennomganger, sprintoppstarter, pakkelister, kundeonboarding. Bygg hver av dem som en mal med seksjoner, oppgaver, notater og relative frister, eller start fra 49 ferdige maler i åtte kategorier."
      screen: editor
    - label: "Variabler"
      title: "Fyll bare inn det som endrer seg."
      text: "Legg plassholdere som {{kunde}} eller {{frist}} i oppgavetitler og notater. Når du sender ut, spør Templator etter dem med datovelger, talltastatur eller meny, og husker standardverdier og tidligere svar."
      ticks:
        - "Variabler for tekst, dato, tall og valg"
        - "Frister som følger en datovariabel"
        - "Autofullføring av variabler mens du skriver"
      diagram: variables
    - label: "Gjennomgang"
      title: "Se over, og send."
      text: "Hver utsending åpner et gjennomgangsark. Slå av oppgavene du ikke trenger denne gangen (eller en hel seksjon på én gang) og send bare det som betyr noe."
      screen: dispatch
    - label: "Destinasjoner"
      title: "Havner der du allerede jobber."
      text: "Apple Påminnelser fungerer rett ut av boksen. Med Pro sender Templator også til Things 3 som prosjekter med overskrifter, til Todoist-prosjekter, og til OmniFocus med frister intakt."
      diagram: destinations
  diagram:
    template_label: "Mal"
    result_label: "Sendt ut"
    rows:
      - before: "Oppstartsmøte med {{kunde}}"
        after: "Oppstartsmøte med Fjord & Co."
      - before: "Send oppsummering innen {{frist}}"
        after: "Send oppsummering innen fredag"
    destinations:
      - name: "Påminnelser"
        note: "Gratis · innebygd"
      - name: "Things 3"
        note: "Pro · prosjekter med overskrifter"
      - name: "Todoist"
        note: "Pro · eksisterende eller nye prosjekter"
      - name: "OmniFocus"
        note: "Pro · TaskPaper med frister"
  details_label: "Detaljene"
  details_title: "Små ting, gjort ordentlig."
  details:
    - k: "Widgeter på Hjem-skjermen"
      v: "Send ut en favorittmal uten å åpne appen."
    - k: "Siri og Snarveier"
      v: "Kjør maler fra Spotlight, Snarveier eller Handlingsknappen."
    - k: "Del maler"
      v: "Eksporter .templator-filer og send dem med AirDrop, Meldinger eller e-post."
    - k: "iCloud-synk"
      v: "Malene holdes synkronisert mellom iPhone og iPad."
    - k: "Sveip for å sende"
      v: "Send en enkel mal rett fra listen."
    - k: "Festing og farger"
      v: "Hold de mest brukte malene øverst, i én av ti fargeoverganger."
  plans_label: "Pris"
  plans_title: "Gratis å starte. Pro når den fortjener plassen."
  plans:
    - name: "Gratis"
      text: "Nok til å bli en del av uken din. Ingen konto nødvendig."
      items:
        - "3 maler"
        - "2 variabler per mal"
        - "Apple Påminnelser"
        - "iCloud-synk og malgalleriet"
    - name: "Pro"
      text: "For arbeidsflytene du kjører hver uke. Tilgjengelig som kjøp i appen."
      items:
        - "Ubegrenset med maler og variabler"
        - "Things 3, Todoist og OmniFocus"
        - "Dynamiske frister"
        - "Festede maler og ny liste per utsending"
  privacy_label: "Personvern"
  privacy_title: "Malene dine forblir dine."
  privacy_text: "Malene lagres på enheten din og i din private iCloud-beholder. Det er ingen konto å opprette, og studioet kan ikke se malene dine. Anonym bruksstatistikk hjelper med å forbedre appen. Den knyttes aldri til deg og selges aldri."
  privacy_link: "Personvernerklæring (engelsk)"
  terms_link: "Vilkår for bruk (engelsk)"
  closing_title: "Templator for iPhone og iPad."
  closing_text: "Gratis å laste ned, med valgfri Pro-oppgradering."
