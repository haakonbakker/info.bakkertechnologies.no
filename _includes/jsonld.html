{%- if page.product -%}
{%- assign product = site.data.products | where: 'id', page.product | first -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MobileApplication",
  "name": {{ product.store_name | default: product.name | jsonify }},
  "description": {{ product[page.lang].summary | jsonify }},
  "operatingSystem": {% if product.platforms contains 'iPad' %}"iOS, iPadOS"{% else %}"iOS"{% endif %},
  "applicationCategory": "ProductivityApplication",
  "url": {{ page.url | absolute_url | jsonify }},
  {%- if product.app_store %}
  "downloadUrl": {{ product.app_store | jsonify }},
  {%- endif %}
  "image": {{ product.icon | append: '-256.webp' | absolute_url | jsonify }},
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "author": { "@type": "Organization", "name": "Bakker Technologies", "url": {{ '/' | absolute_url | jsonify }} }
}
</script>
{%- elsif page.url == '/' or page.url == '/no/' -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Bakker Technologies",
  "url": {{ '/' | absolute_url | jsonify }},
  "logo": {{ '/assets/img/apple-touch-icon.png' | absolute_url | jsonify }},
  "email": "support@bakkertechnologies.no",
  "address": { "@type": "PostalAddress", "addressLocality": "Oslo", "addressCountry": "NO" },
  "founder": { "@type": "Person", "name": "Haakon Bakker" }
}
</script>
{%- endif -%}
