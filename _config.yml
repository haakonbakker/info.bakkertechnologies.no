title: "Bakker Technologies"
tagline: "iOS Product Development & Consultancy"
description: "Independent software studio from Oslo, Norway. Native iOS apps and senior technical consultancy."
baseurl: ""
url: "https://bakkertechnologies.no"
lang: "en"
permalink: pretty

logo: "/favicon.svg"
image: "/assets/img/og/home.jpg"
locale: "en_US"

author:
  name: "Haakon Bakker"
  email: "support@bakkertechnologies.no"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

github: [metadata]

defaults:
  - scope:
      path: ""
    values:
      lang: "en"
      locale: "en_US"
  - scope:
      path: "no"
    values:
      lang: "no" # must be quoted; YAML treats bare 'no' as boolean false
      locale: "nb_NO"

exclude:
  - README.md
  - start-local.sh
  - Gemfile
  - Gemfile.lock
  - vendor
  - .cursor
